<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-label="Abstract visual representing real-time AI video and voice connection">
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171340"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </linearGradient>
    <radialGradient id="hero-glow-a" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hero-glow-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b7ffb" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8b7ffb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hero-frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a89bff"/>
      <stop offset="100%" stop-color="#5b4fe0"/>
    </linearGradient>
    <linearGradient id="hero-person" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e5ff"/>
      <stop offset="100%" stop-color="#b7adfd"/>
    </linearGradient>
  </defs>

  <rect width="960" height="720" rx="28" fill="url(#hero-bg)"/>
  <circle cx="150" cy="140" r="260" fill="url(#hero-glow-b)"/>
  <circle cx="820" cy="600" r="280" fill="url(#hero-glow-a)"/>

  <!-- neural network mesh -->
  <g stroke="#8b7ffb" stroke-opacity="0.25" stroke-width="1.4">
    <line x1="90" y1="600" x2="220" y2="520"/>
    <line x1="220" y1="520" x2="180" y2="410"/>
    <line x1="220" y1="520" x2="330" y2="560"/>
    <line x1="330" y1="560" x2="420" y2="470"/>
    <line x1="780" y1="150" x2="700" y2="230"/>
    <line x1="700" y1="230" x2="760" y2="320"/>
    <line x1="700" y1="230" x2="620" y2="180"/>
    <line x1="860" y1="260" x2="780" y2="150"/>
  </g>
  <g fill="#2dd4bf">
    <circle cx="90" cy="600" r="4.5"/>
    <circle cx="220" cy="520" r="5.5"/>
    <circle cx="180" cy="410" r="3.5"/>
    <circle cx="330" cy="560" r="4"/>
    <circle cx="420" cy="470" r="3.5"/>
  </g>
  <g fill="#a89bff">
    <circle cx="780" cy="150" r="4.5"/>
    <circle cx="700" cy="230" r="5.5"/>
    <circle cx="760" cy="320" r="4"/>
    <circle cx="620" cy="180" r="3.5"/>
    <circle cx="860" cy="260" r="3.5"/>
  </g>

  <!-- real-time transmission rings -->
  <g fill="none" stroke="#8b7ffb" stroke-opacity="0.35">
    <circle cx="480" cy="330" r="150"/>
    <circle cx="480" cy="330" r="196"/>
  </g>

  <!-- central video frame with human silhouette -->
  <rect x="368" y="176" width="224" height="308" rx="32" fill="url(#hero-frame)" opacity="0.16"/>
  <rect x="368" y="176" width="224" height="308" rx="32" fill="none" stroke="url(#hero-frame)" stroke-width="2.5"/>
  <circle cx="480" cy="300" r="54" fill="url(#hero-person)"/>
  <path d="M400 452c8-56 48-92 80-92s72 36 80 92" fill="url(#hero-person)" opacity="0.9"/>

  <!-- connection pulse indicator -->
  <circle cx="560" cy="206" r="9" fill="#2dd4bf"/>
  <circle cx="560" cy="206" r="9" fill="none" stroke="#2dd4bf" stroke-width="2" opacity="0.6">
    <animate attributeName="r" values="9;24;9" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- voice waveform -->
  <g transform="translate(120,600)" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round">
    <line x1="0" y1="-10" x2="0" y2="10"/>
    <line x1="16" y1="-22" x2="16" y2="22"/>
    <line x1="32" y1="-34" x2="32" y2="34"/>
    <line x1="48" y1="-16" x2="48" y2="16"/>
    <line x1="64" y1="-28" x2="64" y2="28"/>
    <line x1="80" y1="-12" x2="80" y2="12"/>
    <line x1="96" y1="-20" x2="96" y2="20"/>
  </g>

  <g transform="translate(700,560)" stroke="#a89bff" stroke-width="4" stroke-linecap="round">
    <line x1="0" y1="-14" x2="0" y2="14"/>
    <line x1="16" y1="-30" x2="16" y2="30"/>
    <line x1="32" y1="-10" x2="32" y2="10"/>
    <line x1="48" y1="-24" x2="48" y2="24"/>
    <line x1="64" y1="-16" x2="64" y2="16"/>
  </g>
</svg>
