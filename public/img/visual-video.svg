<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Abstract visual representing real-time AI video communication">
  <defs>
    <linearGradient id="vid-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171340"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </linearGradient>
    <radialGradient id="vid-glow" cx="30%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#8b7ffb" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8b7ffb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vid-frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a89bff"/>
      <stop offset="100%" stop-color="#5b4fe0"/>
    </linearGradient>
    <linearGradient id="vid-person" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e5ff"/>
      <stop offset="100%" stop-color="#b7adfd"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" rx="24" fill="url(#vid-bg)"/>
  <circle cx="220" cy="140" r="240" fill="url(#vid-glow)"/>

  <!-- two connected video frames -->
  <rect x="120" y="150" width="230" height="170" rx="18" fill="none" stroke="url(#vid-frame)" stroke-width="2.5"/>
  <circle cx="235" cy="215" r="30" fill="url(#vid-person)"/>
  <path d="M186 300c6-32 28-52 49-52s43 20 49 52" fill="url(#vid-person)" opacity="0.9"/>

  <rect x="450" y="280" width="230" height="170" rx="18" fill="none" stroke="#2dd4bf" stroke-width="2.5"/>
  <circle cx="565" cy="345" r="30" fill="#c9fbf3"/>
  <path d="M516 430c6-32 28-52 49-52s43 20 49 52" fill="#c9fbf3" opacity="0.9"/>

  <!-- transmission link between the two frames -->
  <path d="M350 300 C 400 260, 400 340, 450 350" fill="none" stroke="#8b7ffb" stroke-width="2" stroke-dasharray="6 8" opacity="0.7"/>
  <circle cx="400" cy="312" r="6" fill="#2dd4bf"/>

  <!-- live indicator -->
  <g transform="translate(140,170)">
    <circle r="5" fill="#e2404a"/>
    <circle r="5" fill="none" stroke="#e2404a" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="5;16;5" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- neural nodes scattered -->
  <g fill="#a89bff" opacity="0.8">
    <circle cx="660" cy="150" r="4"/>
    <circle cx="700" cy="200" r="3"/>
    <circle cx="620" cy="200" r="3"/>
  </g>
  <g stroke="#8b7ffb" stroke-opacity="0.3" stroke-width="1.2">
    <line x1="660" y1="150" x2="700" y2="200"/>
    <line x1="660" y1="150" x2="620" y2="200"/>
  </g>

  <g transform="translate(90,520)" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round">
    <line x1="0" y1="-10" x2="0" y2="10"/>
    <line x1="16" y1="-20" x2="16" y2="20"/>
    <line x1="32" y1="-30" x2="32" y2="30"/>
    <line x1="48" y1="-14" x2="48" y2="14"/>
    <line x1="64" y1="-24" x2="64" y2="24"/>
  </g>
</svg>
