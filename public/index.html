<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Transaction History</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="demo-banner">
    DEMO MODE — All data below is simulated sample data for demonstration purposes only. No real payments are processed.
  </div>

  <main class="container">
    <header class="page-header">
      <h1>Transaction History</h1>
      <p class="subtitle">Demo account</p>
    </header>

    <section class="actions">
      <button id="simulate-video" type="button">Simulate Purchase: Real-Time Video Credit ($20.00)</button>
      <button id="simulate-voice" type="button">Simulate Purchase: Real-Time Voice Changer Credit ($10.00)</button>
    </section>

    <table class="transactions">
      <thead>
        <tr>
          <th>Date</th>
          <th>Description</th>
          <th>Amount</th>
          <th>Status</th>
          <th>Reference ID</th>
        </tr>
      </thead>
      <tbody id="transactions-body">
        <tr><td colspan="5">Loading…</td></tr>
      </tbody>
    </table>
  </main>

  <script src="app.js"></script>
</body>
</html>
